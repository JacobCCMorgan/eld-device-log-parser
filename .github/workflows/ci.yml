name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: rebuild the report from the published logs
        run: eldlog report data/logs/*.log.gz --out /tmp/ci_reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: /tmp/ci_reports
          retention-days: 7
